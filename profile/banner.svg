<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 680" width="2400" height="680">
  <defs>
    <!-- Background warm subtle gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="45%" stop-color="#fcf4e8"/>
      <stop offset="100%" stop-color="#f7e1c6"/>
    </linearGradient>

    <!-- Warm ground baseline gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2dac0"/>
      <stop offset="50%" stop-color="#ebcfb0"/>
      <stop offset="100%" stop-color="#f2dac0"/>
    </linearGradient>

    <!-- Ground shadow gradient under figures -->
    <linearGradient id="groundShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9bc99" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ebcfb0" stop-opacity="0"/>
    </linearGradient>

    <!-- Terminal header gradient -->
    <linearGradient id="termHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#0f111c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="2400" height="680" fill="url(#bgGradient)"/>

  <!-- Ground Plane -->
  <rect x="0" y="585" width="2400" height="95" fill="url(#groundGrad)"/>
  <rect x="0" y="585" width="2400" height="12" fill="url(#groundShadow)"/>
  <line x1="0" y1="585" x2="2400" y2="585" stroke="#d5be9f" stroke-width="2.5" opacity="0.75"/>

  <!-- ====================================================================== -->
  <!-- TYPOGRAPHY                                                             -->
  <!-- ====================================================================== -->
  <!-- Wortmarke: assistassets -->
  <text x="90" y="96" fill="#1a1a2e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58px" font-weight="800" letter-spacing="-1.2px">assistassets</text>

  <!-- Tagline: woertlich aus Org-README -->
  <text x="90" y="140" fill="#4d5069" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20.5px" font-weight="500" letter-spacing="-0.2px">Local-first software assistants — starting with finance-oriented evidence review and clear no-advice boundaries</text>

